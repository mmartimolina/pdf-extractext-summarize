[project]
name = "pdf-summarize"
version = "0.1.0"
description = "Microservicio de sumarización de texto extraído de documentos PDF del ecosistema pdf-extractext"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "prometheus-client>=0.23.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "--cov=pdf_summarize --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.ruff]
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
